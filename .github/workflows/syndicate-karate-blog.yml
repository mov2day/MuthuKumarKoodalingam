name: Syndicate Karate blog

on:
  push:
    branches: [main]
    paths:
      - 'content/karate/*.md'
      - 'scripts/syndicate.mjs'
      - '.github/workflows/syndicate-karate-blog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syndicate-new-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect articles to syndicate
        id: changed
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            files=$(git ls-files 'content/karate/*.md')
          else
            content_files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'content/karate/*.md')
            infra_changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'scripts/syndicate.mjs' '.github/workflows/syndicate-karate-blog.yml')
            if [[ -n "$content_files" ]]; then
              files="$content_files"
            elif [[ -n "$infra_changed" ]]; then
              files=$(git ls-files 'content/karate/*.md')
            else
              files=""
            fi
          fi
          {
            echo 'files<<EOF'
            echo "$files"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish to DEV and Hashnode
        if: steps.changed.outputs.files != ''
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_PAT: ${{ secrets.HASHNODE_PAT }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
        shell: bash
        run: |
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            echo "Syndicating $file"
            node scripts/syndicate.mjs "$file"
          done <<< "${{ steps.changed.outputs.files }}"

      - name: Nothing to syndicate
        if: steps.changed.outputs.files == ''
        run: echo 'No Karate articles need syndication for this run.'
